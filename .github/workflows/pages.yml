# Validation only. This workflow does not deploy production.
# Production deploys must run from:
# /Users/tylerpreisser/Desktop/Preisser Solutions/Preisser Solutions Website/Website - Current
# with: npx wrangler pages deploy out --project-name preisser-solutions

name: Validate Site

# MANUAL FALLBACK ONLY (workspace CLAUDE.md §4a, 2026-09-24). CI is the local ci-local gate (scripts/ci-steps.sh,
# posted as the ci-local commit status). This workflow no longer runs on push or pull_request; invoke it by
# hand with `gh workflow run <file>` if the gate machine is down.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "validate-site-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      # 22.18+ is REQUIRED, not a preference: the hermetic probes import
      # functions/api/subscribe.ts and functions/_middleware.ts directly and
      # rely on Node's built-in type stripping, which is only on by default
      # from 22.18. Also pinned in package.json "engines".
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: node --version

      # Hermetic. No network, no secrets, no browser, no build: the handlers'
      # fetch is swapped for a recorder and the middleware is composed in
      # process. Runs before the build so it fails in seconds.
      #
      # Invoked as `npm test` — the package's aggregate entry point — and NOT as
      # a list of probe filenames. `test` -> `test:unit` -> the chained probes,
      # so adding the next hermetic probe is a one-line package.json change and
      # needs no edit to this workflow. A probe that exists but is not wired
      # into CI protects nothing.
      - name: Hermetic probes (subscribe endpoint + host middleware)
        run: npm test

      - run: npm run build
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run validate:seo

      # Drives the footer signup in a real browser against the static export
      # produced by the build above. /api/subscribe is intercepted in-page, so
      # no email is ever sent.
      - name: Install Playwright browsers (footer test + Proof Stage gate)
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Test the footer signup in a browser
        run: |
          npx --yes serve out -l 4321 --no-clipboard &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:4321/privacy && break
            sleep 1
          done
          # Hard assert the bind. `serve` can fail to bind and stay quiet, and a
          # probe pointed at nothing must not be mistaken for a probe that passed.
          curl -sf -o /dev/null http://127.0.0.1:4321/privacy
          PS_TEST_BASE_URL=http://127.0.0.1:4321 npm run test:e2e

      # Proof Stage privacy guard (ADR-0016 §5): prove it can fail, then scan.
      - name: Proof Stage privacy guard, self-test
        run: node tests/demo-privacy.probe.mjs --self-test

      # The deny list is never in this public repo. It comes from the DEMO_DENYLIST
      # Actions secret; unset means an empty file, and the probe fails closed.
      - name: Proof Stage privacy guard
        env:
          DEMO_DENYLIST: ${{ secrets.DEMO_DENYLIST }}
        run: |
          umask 077
          printf '%s\n' "$DEMO_DENYLIST" > "$RUNNER_TEMP/demo-denylist.txt"
          PS_DEMO_DENYLIST="$RUNNER_TEMP/demo-denylist.txt" node tests/demo-privacy.probe.mjs

      - name: Proof Stage browser gate (chromium, webkit, firefox)
        run: npx playwright test --config playwright.config.ts
