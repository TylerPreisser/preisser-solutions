# Validation only. This workflow does not deploy production.
# Production deploys must run from:
# /Users/tylerpreisser/Desktop/Preisser-Solutions-Current-Clean
# with: npx wrangler pages deploy out --project-name preisser-solutions

name: Validate Site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: "validate-site-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run validate:seo
